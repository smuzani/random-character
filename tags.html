<div id="app">
  <div class="container">
    <h1 class="text-center">Tags</h1>
    <br>
    <div class="form-group row justify-content-center">
      <label for="tag-group" class="col-4 col-md-3 col-xl-2">Tag Group</label>
      <div class="col-8 col-md-5 col-xl-4">
        <select class="form-control" id="tag-group" v-model="group.current">
          <option v-for="g in groups" v-bind:value="g.uid">
            {{ g.name }}
          </option>
        </select>
      </div>
      <div id="tag-group-entry" class="form-inline col-12 col-md-6">
        <input type="text" v-model="group.new" placeholder="New Tag Group" class="form-control"> 
        <button @click="addTagGroup" class="btn btn-dark"><i class="fas fa-plus"></i></button>
      </div>
    </div> 
    <hr>
    <div class="form-inline" id="data-entry" hidden>
      <input type="text" id="form-name" v-model="item.name" placeholder="Name" class="form-control"> 
      <input type="text" v-model="item.desc" placeholder="Description" class="form-control" v-on:keyup.enter="addItem">
      <button @click="addItem" class="btn btn-dark"><i class="fas fa-plus"></i></button>
    </div>
    <br><br>
    <table class="table table-striped table-bordered table-sm" id="crud" hidden>
      <thead class="thead-light">
        <th>Name</th>
        <th>Description</th>
        <th class="col-2">Edit/Del</th>
      </thead>
      <tr v-for="(item, index) in items">
        <td>
          <input v-if="item.edit" type="text" v-model="item.name" v-on:keyup.enter="updateItem(index)">
          <span v-else>{{item.name}} </span>
        </td>
        <td>
          <input v-if="item.edit" type="text" v-model="item.desc" v-on:keyup.enter="updateItem(index)">
          <span v-else>{{item.desc}} </span>
        </td>
        <td>
          <button @click="updateItem(index)" class="btn btn-info"><i class="far fa-edit"></i></button>
          <button @click="removeItem(index)" class="btn btn-danger"><i class="far fa-trash-alt"></i></button>
        </td>
      </tr>
    </table>

    <!-- Show errors and dialogs -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script>window.jQuery || document.write('<script src="js/vendor/jquery-3.3.1.min.js"><\/script>')</script>

          $('#errors-modal').load('segment-modal-errors.html');
        });

    </div>

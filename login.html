<div class="container">
  <!-- Snippet from https://bootsnipp.com/snippets/featured/login-and-register-tabbed-form -->
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="panel panel-login">
        <div class="panel-heading">
          <div class="row justify-content-center">
            <div class="col">
              <a href="#" class="active" id="register-form-link">Register</a>
            </div>
            <div class="col">
              <a href="#" id="login-form-link">Login</a>
            </div>
          </div>
          <hr>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="col-lg-12">
              <form id="login-form" style="display: block;">
                <div class="form-group">
                  <input type="text" name="username" id="login-username" tabindex="1" class="form-control" placeholder="Username" value="" required>
                </div>
                <div class="form-group">
                  <input type="password" name="password" id="login-password" tabindex="2" class="form-control" placeholder="Password" v-on:keyup.enter="submitLogin" required>
                </div>
                <div class="form-group">
                  <div class="row">
                    <div class="col-md-12"><input class="btn btn-secondary btn-block" type="button" id="login-submit" value="BEGIN"></div>
                  </div>
                </div>
                <div class="form-group">
                  <div class="row">
                    <div class="col-lg-12">
                      <div class="text-center">
                        <a href="forgot-password.html" class="forgot-password" id="forgot-password">Forgot Password?</a>
                      </div>
                    </div>
                  </div>
                </div>
              </form>
              <form id="register-form" style="display: none;">
                <div class="form-group">
                  <input type="text" name="username" id="register-username" tabindex="1" class="form-control" placeholder="Username" value="" required>
                </div>
                <div class="form-group">
                  <input type="email" name="email" id="register-email" tabindex="1" class="form-control" placeholder="E-mail Address" value="" required>
                </div>
                <div class="form-group">
                  <input type="password" name="password" id="register-password" tabindex="2" class="form-control" placeholder="Password" required>
                </div>
                <div class="form-group">
                  <input type="password" name="confirm-password" id="register-confirm-password" tabindex="3" class="form-control" placeholder="Confirm Password" required>
                </div>
                <div class="form-group">
                  <div class="row">
                    <div class="col-md-12"><input class="btn btn-secondary btn-block" type="button" id="register-submit" value="REGISTER"></div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Show errors and dialogs -->
      <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
      <script>window.jQuery || document.write('<script src="js/vendor/jquery-3.3.1.min.js"><\/script>')</script>

        <script>
          'use strict';
          $(function(){
            $('#errors-modal').load('segment-modal-errors.html');
          });
        </script>
      </div>
    </div>
  </div>
</div>

/* new tag model:
 portrayal only: often shallow/side personality traits like clumsy or heavy eater
 appearance only: physical descriptors, clothing, fashion. rarely ever appearance + portrayal
 portrayal > appearance: personality reflected by fashion
 power > portrayal: internal strength that radiates out
 personal > power: power that results from a particular personal trait
 personal > wealth: particular items that result from a personality (e.g. bigger guns)
 wealth + power: power reliant on ownership of an item, or wealth resulting from power
 power only: inherent power. or some tags have many variations, e.g. street smart, book smart, strong, and should be
  power based in detail. Sometimes things like strong but not muscular.
 personal: meta or secret
 wealth + power > portrayal. large personality sets e.g. walking the earth, billionaire
 none: certain tags like number two, to avoid conflict

 Some things are surface only - sweetness, to be combined with the actual underlying trait.
 Some things are tags only to prevent conflict, likely used in portrayal or personal.
 For anything that covers more than 2, consider splitting it.

 TODO:
 Consider making only one model per tag, with the archetype holding appropriate tags
 Make sure wealth tags can't definition conflict. E.g. everyman with rich

 Power-only tags comboed with portrayal-only tags

  switch (tag) {
    case TENERGETIC: // power, portrayal
      return "Energetic. ";
    case TLETHARGIC: // power, portrayal
      return "Lacks energy. ";
    case TTALKATIVE: // portrayal

    case TCARING: // portrayal
      return "Cares about others. ";
    case TRUTHLESS: // portrayal
      return "Ruthless, willing to dispose of anyone in the way. ";
    case TLEADER: // power, portrayal
      return "Strong leadership skills. ";
    case TFOLLOWER: // portrayal
      return "Prefers to follow orders. ";
    case TDISPOSABLE: // personal
      return "Not a necessary part of the story. ";
    case TNECESSARY: // power
      return `The team needs to keep ${p.him}, for some reason. `;
    case TBIG: // appearance
      return "Physically large. ";
    case TSMALL: // appearance
      return "Physically small. ";
    case TNAIVE: // portrayal, power
      return "Easily manipulated. ";
    case TFAKEDITZ: // portrayal (appears same as naive)
      return `Purposely appearing dumber than ${p.she} really is to avoid attention. `;
    case TSMART: // portrayal. Smart in itself is not a power base. There are many forms of smartness, power base those instead.
      return "";
    case TTACTICIAN: // power, portrayal
      return "Gifted tactician. ";
    case TTACTICLESS: // power, portrayal

// V7.5 Tier 2: Appearance system (skin, hair, eyes, physique, facial hair).
// Two layers: colors roll freely; body/style rules are tag-aware so they
// can't contradict personality tags (TBIG, TSMALL, TCLASSY, TNERD...).
// Generic rules engine — clothing and palette systems will reuse rollRules().

// A rule: { name, weight, requires: [tags], excludes: [tags], adds: [tags], texts: [strings-or-fns] }
function rollRules(rules, tags) {
  const valid = rules.filter(r =>
    (r.requires || []).every(t => tags.has(t)) &&
    !(r.excludes || []).some(t => tags.has(t)));
  if (!valid.length) return null;
  let n = roll(1, valid.reduce((s, r) => s + r.weight, 0));
  for (const r of valid) {
    n -= r.weight;
    if (n <= 0) return r;
  }
  return valid[valid.length - 1];
}

// Internal appearance tags (adds), used only for coherence between rolls
const ATOWERING = 'a-towering';
const ADELICATE = 'a-delicate';
const AGROOMED = 'a-groomed';
const ASCRUFFY = 'a-scruffy';
// V7.6: skin rolls first and dark tones set this; naturally-implausible hair
// and eye colors carry `excludes: [ADARKSKIN]` so coloring stays coherent
// without racial bucket presets. Dyed/unnatural colors stay open to everyone,
// and a trope pin (forcedRule) still overrides — the trope named the color.
const ADARKSKIN = 'a-skin-dark';

// Color-pinning tags, set by aspects rather than by the appearance roll. A trope
// that names a color outright (a Fiery Redhead whose hair isn't red isn't the
// trope) sets one of these; the matching rule's `forcedBy` then wins the layer.
// Aspects that pin the same layer must exclude each other's tag — see the color
// tropes in generator7.js's initAspects().
const AHAIRRED = 'a-hair-red';
const AHAIRBLOND = 'a-hair-blond';
const AHAIRBLACK = 'a-hair-black';
const AHAIRGRAY = 'a-hair-gray';
const ASKINPALE = 'a-skin-pale';
const AEYESBLUE = 'a-eyes-blue';
const AEYESRED = 'a-eyes-red';

// Skin/hair/eye/physique rules carry a short `value` (single source of truth)
// so the portrait header can show Eyes / Hair / Skin / Build without re-deriving
// them from the prose sentence.
//
// Color rules may carry a palette seed, which rollAppearance() may pick to steer
// the character's palette (see pickSeed below). Two kinds:
//   `hue` (0-360)     a chromatic color: red hair drives a red palette
//   `family`          an achromatic one: black hair drives a charcoal scheme
//                     (a NEUTRAL_FAMILIES key in palette-details.js)
// A rule with neither contributes nothing and leaves the palette random — that's
// dyed hair (no fixed color) and mismatched eyes (not one color). Skin stays
// seedless across the board: the tones cluster in a narrow low-chroma warm band
// that makes for dull seeds, and letting every pale character drive an ivory
// palette would wash out a good fraction of the cast. So Raven Hair, Ivory Skin
// steers the palette through its *hair* pin, and its skin pin is header-only.
//
// A rule may also carry `forcedBy`: the tag an aspect sets to pin this color.
// When that tag is present the rule skips the weighted roll entirely, and the
// color it pins wins the palette seed (see pickSeed).
function skinRules() {
  return [
    { name: 'pale', value: 'Pale', weight: 3, forcedBy: ASKINPALE, texts: [`${p.She} has pale skin that burns before it tans.`] },
    { name: 'porcelain', value: 'Porcelain', weight: 1, texts: [`${p.She} has smooth, porcelain-pale skin.`] },
    { name: 'sickly', value: 'Sickly Pale', weight: 1, excludes: [TATTRACTIVE, TSEXY], texts: [`${p.She} is unhealthily pale, as if sunlight were a rumor.`] },
    { name: 'fair', value: 'Fair', weight: 4, texts: [`${p.She} has fair, freckled skin.`, `${p.She} has a fair complexion.`] },
    { name: 'golden', value: 'Golden', weight: 2, texts: [`${p.She} has warm, golden-toned skin.`] },
    { name: 'olive', value: 'Olive', weight: 4, texts: [`${p.She} has an olive complexion.`] },
    { name: 'tan', value: 'Tan', weight: 4, texts: [`${p.She} has tan, sun-weathered skin.`, `${p.She} has a warm bronze complexion.`] },
    { name: 'bronze', value: 'Bronze', weight: 2, texts: [`${p.She} has sun-kissed bronze skin.`] },
    { name: 'brown', value: 'Brown', weight: 4, adds: [ADARKSKIN], texts: [`${p.She} has brown skin.`, `${p.She} has a deep copper complexion.`] },

}

// A rule's palette seed, or null when it has none (dyed hair, mismatched eyes,
// every skin tone). `hue` and `family` are mutually exclusive.
function ruleSeed(rule) {
  if (typeof rule.hue === 'number') return { hue: rule.hue };
  if (rule.family) return { family: rule.family };
  return null;
}

// A trope that names a color pins the matching rule, skipping the weighted roll.
// Returns null when this layer isn't pinned. Rules without `forcedBy` are never
// pinnable, so layers that no trope names behave exactly as before.
function forcedRule(rules, tags) {
  return rules.find(r => r.forcedBy && tags.has(r.forcedBy)) || null;
}

// From the rolled color features that carry a seed, pick one to steer the palette
// (or null if none did this run — then the palette stays fully random). This is
// what "tie a physical color into the palette" means: the character's own
// coloring drives it. Black hair yields { family: 'black' }, red hair { hue: 15 }.
//
// A pinned color wins outright. Fiery Redhead named the red, so seeding off her
// blue eyes instead would contradict the trope that just rolled. Unpinned colors
// keep the random pick among themselves.
function pickSeed(rolled) {
  const seeded = rolled.filter(r => r.seed);
  if (!seeded.length) return null;
  const pinned = seeded.filter(r => r.pinned);
  const pool = pinned.length ? pinned : seeded;
  return pool[roll(1, pool.length) - 1].seed;
}

// Rolls the full appearance and returns:
//   values:  { eyes, hair, skin, build }        — for the portrait header
//   lines:   [sentence, ...]                    — for the Appearance section
//   seed:    { hue } | { family } | null        — the pick among appearance-only
//            candidates (kept for callers that don't roll clothing)
//   seedCandidates: [{ seed, pinned }, ...]     — raw candidates, so the caller
//            can pool them with the clothing system's before running pickSeed()
//   tags:    Set — charTags plus this roll's adds (a-groomed, facial_hair_*...),
//            consumed by the clothing and concept systems downstream
// Eye/hair/skin sentences are suppressed from `lines` (they already show in the
// header); physique keeps its flavor sentence, and grooming + facial hair always
// appear in the section.
function rollAppearance(charTags) {
  const tags = new Set(charTags);
  const values = {};
  const lines = [];
  const colorRolls = [];
  const layers = [
    { rules: skinRules(), key: 'skin', inSection: false, color: true },
    { rules: hairRules(), key: 'hair', inSection: false, color: true },
    { rules: eyeRules(), key: 'eyes', inSection: false, color: true },
    { rules: physiqueRules(), key: 'build', inSection: true },
    { rules: groomingRules(), key: null, inSection: true },
    { rules: hairstyleRules(), key: null, inSection: true },
    { rules: facialHairRules(), key: null, inSection: true },
  ];
  layers.forEach(function (layer) {
    const forced = forcedRule(layer.rules, tags);
    const r = forced || rollRules(layer.rules, tags);
    if (!r) return;
    (r.adds || []).forEach(t => tags.add(t));
    if (layer.key) values[layer.key] = r.value;
    if (layer.color) colorRolls.push({ seed: ruleSeed(r), pinned: !!forced });
    // Rules with empty texts (average build, practical grooming) are silent
    // on purpose — don't push undefined into the section.
    if (layer.inSection) {
      const text = randomArray(r.texts);
      if (text) lines.push(text);
    }
  });
  return { values: values, lines: lines, seed: pickSeed(colorRolls), seedCandidates: colorRolls, tags: tags };
}

// Back-compat: array of appearance sentences only (header suppression applied).
function generateAppearance(charTags) {
  return rollAppearance(charTags).lines;
}

// Rolls the full wardrobe and returns:
//   outfit:  'Sharp Business Suit' | null   — promoted into the <summary> line
//   lines:   [sentence, ...]                — fashion/outfit/flair/accessory prose
//   seedCandidates: [{seed, pinned:false}]  — color flairs, for pickSeed()
//   tags:    Set                            — charTags + fashion_* adds, for the
//                                             concept generator downstream
// "None" rolls for flair/accessory contribute no line: absence stays silent.
function rollClothing(charTags) {
  const tags = new Set(charTags);
  const lines = [];
  const seedCandidates = [];
  let outfit = null;

  const layers = [
    { rules: fashionRules() },
    { rules: outfitRules(), isOutfit: true },
    { rules: flairRules(), color: true },
    { rules: accessoryRules() },
  ];
  layers.forEach(function (layer) {
    const r = rollRules(layer.rules, tags);
    if (!r) return;
    (r.adds || []).forEach(t => tags.add(t));
    if (layer.isOutfit) outfit = r.value;
    if (layer.color) {
      const seed = ruleSeed(r);
      if (seed) seedCandidates.push({ seed: seed, pinned: false });
    }
    if (r.texts.length) lines.push(randomArray(r.texts));
  });
  return { outfit: outfit, lines: lines, seedCandidates: seedCandidates, tags: tags };
}

// Ported from the Bolt prototype (utils/colors.ts), rewritten dependency-free:
// chroma-js's hsl->hex, hex->lab, hex->hsl are replaced with vanilla color math.
// Dropped: 2bit harmony, custom-role generators, TS types. Random-first; trait
// -> color mapping is a committed follow-up, not part of this pass.
//
// Public entry:
//   generatePalette() -> { colors: [{ role, color, usageRatio }], harmony }
//   palettePieSvg(palette, size) -> inline <svg> string (the portrait square)

// --- color math (replaces chroma-js) --------------------------------

// h in [0,360), s/l in [0,100]. Returns "#rrggbb".
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Returns [h(0-360), s(0-100), l(0-100)].
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

// Returns CIE L*a*b* as [L, a, b] (D65). hex -> rgb -> xyz -> lab.
function hexToLab(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => {
    v /= 255;
    return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92;
  });
  // sRGB -> XYZ (D65)
  let x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
  let y = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 1.0;
  let z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  x = f(x); y = f(y); z = f(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}

// unable to emit any gray, black or white at all.
//
// A neutral family drives the *whole* triplet rather than contributing one
// swatch: every member goes desaturated and shares a lightness band, so black
// reads as a charcoal scheme rather than one black wedge among colors. Hue is
// near-meaningless at this saturation, so the generators roll it freely.
//
// The gates have to relax to match — three near-grays are legitimately similar,
// and the chromatic thresholds (ΔE 12 / ΔL 20) would reject every one of them.
// `gray` is ours; Bolt had only black and white, and silver hair needs a mid
// band that neither covers.
const NEUTRAL_FAMILIES = {
  black: { sat: [0, 20], light: [8, 35], deltaE: 6, dLight: 8 },
  gray: { sat: [0, 20], light: [35, 70], deltaE: 6, dLight: 8 },
  white: { sat: [0, 25], light: [70, 98], deltaE: 3, dLight: 4 },

const NEUTRAL_HSL = { h: 210, s: 15, l: 50 };

// Hue bands per color family; excludes the 60-95 yellow-green zone.
const FAMILY_BANDS = [
  [345, 360], [0, 15],   // red
  [20, 35],              // orange
  [40, 55],              // yellow
  [100, 150],            // green
  [160, 190],            // cyan
  [200, 250],            // blue
  [260, 300],            // purple
  [305, 340],            // magenta

function randomFromBands(bands) {
  const total = bands.reduce((sum, [s, e]) => sum + (e - s + 1), 0);
  let r = Math.random() * total;
  for (const [s, e] of bands) {
    const len = e - s + 1;
    if (r < len) return s + Math.floor(r);
    r -= len;
  }
  return bands[0][0];

  return randomFromBands(FAMILY_BANDS);

    h = lerp(h, NEUTRAL_HSL.h, bf);
    s = lerp(s, NEUTRAL_HSL.s, bf);
    v = lerp(v, NEUTRAL_HSL.l, bf);

  return Math.sqrt(

    const cols = [[domH, domS, domV], [supAH, supAS, supAV], [supBH, supBS, supBV]];

// hue by construction. A coin-flip promotes it to the Accent role instead, so

// pop — "randomly pick which becomes the primary or accent color."
function maybeSwapPrimaryAccent(palette) {
  const cols = palette.colors;
  if (cols.length < 3 || roll(1, 2) === 1) return palette;
  const prim = cols[0], acc = cols[2];
  const pRole = prim.role, aRole = acc.role;
  const pRatio = prim.usageRatio, aRatio = acc.usageRatio;
  prim.role = aRole; prim.usageRatio = aRatio;
  acc.role = pRole; acc.usageRatio = pRatio;

// the character's coloring — { hue } or { family } — and may be omitted for a
// fully random palette. Accepts a bare number as the old hue-only form.
function generatePalette(seed) {

  const seeded = !!(seed && (typeof seed.hue === 'number' || NEUTRAL_FAMILIES[seed.family]));

    case 'splitComplementary': palette = generateSplitComplementary(seed) || generateComplementary(seed); break;

// Point on a unit-ish circle, angle measured clockwise from 12 o'clock.
function pieCoord(cx, cy, r, fraction) {
  const angle = 2 * Math.PI * fraction - Math.PI / 2;
  return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
}

// palette -> inline <svg> string. Wedges sized by usageRatio.
function palettePieSvg(palette, size) {

  const total = palette.colors.reduce((s, c) => s + c.usageRatio, 0) || 1;
  let start = 0;
  let paths = '';

    const frac = c.usageRatio / total;
    const end = start + frac;

      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + c.color + '"></circle>';
    } else {
      const [x0, y0] = pieCoord(cx, cy, r, start);
      const [x1, y1] = pieCoord(cx, cy, r, end);
      const large = frac > 0.5 ? 1 : 0;
      paths += '<path d="M' + cx + ',' + cy + ' L' + x0 + ',' + y0 +

"use strict";

const BPERSONALITY = 'personality';
const BTEAMONE = 'team-one';
const BSINGLEPLOT = 'single-plot'; // only one plot
const BTHREEACT = 'three-act'; // three act structure
const BSEVENBASIC = 'seven-basic'; // seven basic plots
const BWANT = 'want';

class Character {
  constructor(initialTags, initialBranches = [BPERSONALITY, BPERSONALITY]) {
    // compare against t.excludes for new roll
    if (initialTags === undefined) {
      this.tags = new Set();
    } else {
      this.tags = new Set(initialTags);
    }

    // compare against t.tags for new roll
    this.excludes = new Set();

    // All of this are rolled to generate character. Not unique.
    this.branches = initialBranches;

    // Tracks aspects applied to this character
    this.aspects = [];
  }
}

class Aspect {
  constructor(name, weight, text,
              type, tags, requirements, excludes,
              branchRequirements, branchExcludes) {
    this.name = name;
    this.weight = weight;
    this.text = text;
    this.type = type;

    // Tags are added to char, and must match character's excludes
    this.tags = new Set(tags);

    // These two must match with existing character
    this.requirements = new Set(requirements);
    this.excludes = new Set(excludes);

    // These two must match with future characters on a search
    this.branchRequirements = new Set(branchRequirements);
    this.branchExcludes = new Set(branchExcludes);
  }
}

function createCharacter(tags, branches = loadInitialBranches()) {
  if (typeof ga !== 'undefined') {
    ga('send', 'event', 'generate', 'create');
  }
  let c = new Character(tags, branches);
  return generate(c);
}

function loadTags() {
  let tags = [];

  const ROLE_ANY = "role-any";
  const ROLE_HERO = "role-hero";
  const ROLE_VILLAIN = "role-villain";
  const ROLE_SUPPORT = "role-support";
  const GENDER_UNISEX = "gender-any";
  const GENDER_MALE = "gender-male";
  const GENDER_FEMALE = "gender-female";

  let role = $('select#role option:selected').attr("id");
  switch (role) {
    case ROLE_HERO:
      tags.push(TFACE);
      break;
    case ROLE_VILLAIN:
      tags.push(THEEL);
      break;
    case ROLE_SUPPORT:
      tags.push(TSUPPORT);
      break;
    case ROLE_ANY:
      tags.push(forceRole());
      break;
    default:
      tags.push(forceRole());
  }

  let gender = '';
  // only add the gender limitations when the checkbox is not ticked
  if (!document.getElementById('no-stereotypes').checked) {
    let genderOption = $('select#gender option:selected').attr("id");
    switch (genderOption) {
      case GENDER_MALE:
        gender = TMALE;
        break;
      case GENDER_FEMALE:
        gender = TFEMALE;
        break;
      case GENDER_UNISEX:
        gender = forceGender();
        break;
      default:
        gender = forceGender();
        break;
    }
    tags.push(gender);
  }
  const charName = $('input#name').val();
  if (charName != "") {
    generatePronouns(gender, charName);
  } else {
    const rName = randomName(gender);
    generatePronouns(gender, rName);
  }
  tags.push(getTeamSize());
  return tags;
}

// One branch table for every consumer (the form reader below, the roll lab).
// Personality rolls FIRST so the want and plot pools filter against a
// personality that already exists — a wise character can't draw Fatal
// Imprudence, a lazy one can't lead a Revolt, a bruiser can't await rescue.
// Before V7.7, want/plot rolled first and personality was structurally unable
// to influence either; the want/plot excludes only bite in this order.
const DETAIL_BRANCHES = {
  "detail-sparse": [BPERSONALITY, BWANT, BSINGLEPLOT],
  "detail-moderate": [BPERSONALITY, BPERSONALITY, BWANT, BSINGLEPLOT],
  "detail-high": [BPERSONALITY, BPERSONALITY, BPERSONALITY, BWANT, BSINGLEPLOT],
  "detail-very-high": [BPERSONALITY, BPERSONALITY, BPERSONALITY, BPERSONALITY, BWANT, BSINGLEPLOT],
};

function branchesForDetail(detail) {
  const branches = DETAIL_BRANCHES[detail] || DETAIL_BRANCHES["detail-moderate"];
  return branches.slice();
}

function loadInitialBranches() {
  let detail = $('select#detail option:selected').attr("id");
  return branchesForDetail(detail);
}

function getTeamSize() {
  const SIZE_ONE = "team-one";
  let size = $('select#team-size option:selected').attr("id");
  switch (size) {
    case SIZE_ONE:
      return BTEAMONE;
  }
  return "";
}

/* generate(Character) */
function generate(c) {
  generateCharacter(c);
  displayCharacter(c);
  return c;
}

function generateCharacter(c) {
  let len = c.branches.length;
  while (len > 0) {
    let branch = c.branches[0];
    switch (branch) {
      case BPERSONALITY:
        generateAspects(c);
        break;
      case BTEAMONE:
        generateSoloTeam(c);
        break;
      case BSINGLEPLOT:
        generateOneShot(c);
        break;
      case BWANT:
        generateWant(c);
        break;
    }

    c.branches.shift(); // remove the one at the front of the array, not the end
    len = c.branches.length;
  }
}

// On a personality search, check that the current character fits whatever 
// aspect is to be rolled
function generateAspects(c) {
  let filtered = obtainRoot(aspects, c);
  let picked = rollRole(filtered);
  if (picked) {
    c.aspects.push(picked);
    addTags(c, picked);
  }
}

// on a team generation, search for aspects that fit the given requirements
function generateSoloTeam(c) {
  let filtered = obtainRoot(soloTeam, c);
  let root = rollRole(filtered);
  if (root) {
    // console.log(root.name);
    c.teamType = root;
    addTags(c, root);

    // Spawn one fitting role, maybe lower BPERSONALITY count by one
    filtered = filterPersonalityFromRoot(aspects, root, c);
    let picked = rollRole(filtered);
    if (picked) {
      // console.log(picked.name);
      c.aspects.push(picked);
      addTags(c, picked);
    }
  }
}

function generateOneShot(c) {
  let filtered = obtainRoot(drama, c);
  let picked = rollRole(filtered);
  if (picked) {
    // console.log(picked.name);
    c.aspects.push(picked);
    addTags(c, picked);
  }
}

function generateWant(c) {
  let filtered = obtainRoot(want, c);
  let picked = rollRole(filtered);
  if (picked) {
    c.aspects.push(picked);
    addTags(c, picked);
  }
}

// This searches for a possible root, based on characteristics already 
// assigned, like FEMALE or HEEL
// c is character, t is trope/target from list to filter
function obtainRoot(roots, c) {
  return roots.filter(function (t) {
    let isValid = true;

    // For each t.requirement and !t.exclude, check that it doesn't match c.tag
    t.requirements.forEach(function (requirement) {
      if (!c.tags.has(requirement)) isValid = false;
    });
    t.excludes.forEach(function (exclude) {
      if (c.tags.has(exclude)) isValid = false;
    });

    // For each t.tag, check that it doesn't match c.exclude.
    // branchRequirements count too: addTags() turns them into real tags on the
    // character, so without this an aspect could smuggle an excluded tag past
    // the gate (e.g. a want adding TBADASS to a rolled Woobie).
    c.excludes.forEach(function (exclude) {
      if (t.tags.has(exclude) || t.branchRequirements.has(exclude)) isValid = false;
    });

    return isValid;
  });
}

// This filters roles that do not fit root criteria for roles
// c is character, t is trope/target from list to filter, 
// root is the role (e.g. team/story) that spawns new roles
function filterPersonalityFromRoot(personalities, root, c) {
  return personalities.filter(function (t) {
    let isValid = true;

    // For each t.requirement and !t.exclude, check that it doesn't match c.tag
    t.requirements.forEach(function (requirement) {
      if (!c.tags.has(requirement)) isValid = false;
    });
    t.excludes.forEach(function (exclude) {
      if (c.tags.has(exclude)) isValid = false;
    });

    // Filter personalities that don't fit the root's expectation
    // For each root.requirement and !root.exclude,
    // check that it doesn't match t.tag
    root.branchRequirements.forEach(function (requirement) {
      if (!t.tags.has(requirement)) isValid = false;
    });
    root.branchExcludes.forEach(function (exclude) {
      if (t.tags.has(exclude)) isValid = false;
    });

    // For each t.tag, check that it doesn't match c.exclude.
    // branchRequirements count too: addTags() turns them into real tags on the
    // character, so without this an aspect could smuggle an excluded tag past
    // the gate (e.g. a want adding TBADASS to a rolled Woobie).
    c.excludes.forEach(function (exclude) {
      if (t.tags.has(exclude) || t.branchRequirements.has(exclude)) isValid = false;
    });

    return isValid;
  });
}

// Reveals the portrait card, renders the palette pie into the square, sets the
// name, the concept subtitle, and the Eyes/Hair/Skin/Build stats. Runs at
// every detail level.
function renderPortraitHeader(values, seed, concept) {
  values = values || {};
  const name = (typeof p !== 'undefined' && p.Sdesc) ? p.Sdesc.toUpperCase() : 'NEW CHARACTER';
  $('#display-name').text(name);
  $('#display-concept').text(concept || '').toggleClass('hidden', !concept);

  if (typeof generatePalette === 'function' && typeof palettePieSvg === 'function') {
    // seed comes from the character's physical coloring — { hue } for a chromatic
    // color, { family } for an achromatic one. Null yields a random palette.
    const palette = generatePalette(seed || undefined);
    $('#portrait-square').html(palettePieSvg(palette, 96));
  }

  $('#stat-eyes').text(values.eyes || '—');
  $('#stat-hair').text(values.hair || '—');
  $('#stat-skin').text(values.skin || '—');
  $('#stat-build').text(values.build || '—');

  // Swap the plain first-load name for the full card.
  $('#display-name-plain').addClass('hidden');
  $('#portrait-card').removeClass('hidden');
}

// Renders the wardrobe into the collapsed Style accordion at the bottom of the
// Physical Attributes section. The outfit name rides in the <summary> so the
// headline fact is on the card without opening it; fashion sense, flair, and
// accessory prose tuck behind the click. Deliberately never touches the open/
// closed state: it starts collapsed, and a reader who opens it keeps it open
// across rerolls.
function renderStyle(clothing) {
  const $details = $('#style-details');
  if (!clothing) {
    $details.addClass('hidden');
    return;
  }
  $('#style-summary-outfit').text(clothing.outfit || 'Unremarkable');
  let styleText = '';
  clothing.lines.forEach(function (line) {
    styleText += '<li class="text-justify">' + line + '</li>';
  });
  $('#results-style').html(styleText);
  $details.removeClass('hidden');
}

// Completes a generated character into displayable data — appearance,
// clothing, palette seed, concept — with no DOM access. The roll lab calls
// this directly; displayCharacter is only the DOM half.
function resolveCharacter(c) {
  // Portrait header: always roll a palette + the 4 appearance values, at any
  // detail level. The full appearance roll (values + section lines) is stashed
  // on the character so the detail branch below reuses it instead of re-rolling.
  let appearance = { values: {}, lines: [], seed: null, seedCandidates: [], tags: c.tags };
  if (typeof rollAppearance === 'function') {
    appearance = rollAppearance(c.tags);
  }
  c.appearance = appearance;

  // Clothing rolls off the appearance-augmented tag set. Its color flairs join
  // the palette-seed pool unpinned, so a trope-pinned hair color still wins,
  // but Red Accents can steer an otherwise unseeded palette.
  let clothing = null;
  if (typeof rollClothing === 'function') {
    clothing = rollClothing(appearance.tags || c.tags);
  }
  c.clothing = clothing;
  let seed = appearance.seed;
  if (clothing && typeof pickSeed === 'function') {
    seed = pickSeed((appearance.seedCandidates || []).concat(clothing.seedCandidates));
  }
  c.paletteSeed = seed;
  // The concept reads the full end-of-roll tag set — personality + wants +
  // plots + the appearance and clothing rolls' adds — so it goes last.
  let concept = null;
  if (typeof generateConcept === 'function') {
    concept = generateConcept(clothing ? clothing.tags : (appearance.tags || c.tags));
  }
  c.concept = concept;
  return c;
}

// Assembles every detail-mode section as data: arrays of
// { text, src: { bank, tag, via } } where `via` names the aspect that put the
// tag on the character. Provenance stays content-level (trope names, tag
// constants) — never file/line — so it survives an engine rewrite.
// displayCharacter renders from this; the roll lab exports it.
function characterSections(c) {
  // Map each tag back to the aspect that added it.
  let owners = {};
  c.aspects.forEach(function (a) {
    a.tags.forEach(function (t) { owners[t] = a.name; });
    a.branchRequirements.forEach(function (t) { owners[t] = a.name; });
  });
  if (c.teamType) {
    c.teamType.tags.forEach(function (t) { owners[t] = c.teamType.name; });
  }

  let sections = {
    appearance: [], portrayal: [], power: [],
    personal: [], wealth: [], plot: [], want: []
  };
  const line = (bank, tag, text) =>
    ({ text: text, src: { bank: bank, tag: tag || null, via: (tag && owners[tag]) || null } });

  // Physique flavor, grooming, and facial hair from the appearance roll.
  // Eye/hair/skin sentences are suppressed there since they show in the
  // portrait header.
  (c.appearance ? c.appearance.lines : []).forEach(function (text) {
    sections.appearance.push(line('rollAppearance', null, text));
  });

  c.tags.forEach(function (t) {
    let appearance = tagToAppearance(t);
    if (appearance) sections.appearance.push(line('tagToAppearance', t, appearance));
    let portrayal = tagToPortrayal(t);
    if (portrayal) sections.portrayal.push(line('tagToPortrayal', t, portrayal));
    let power = tagToPowerBase(t);
    if (power) sections.power.push(line('tagToPowerBase', t, power));
    let personal = tagToHiddenPersonality(t);
    if (personal) sections.personal.push(line('tagToHiddenPersonality', t, personal));
    let wealth = tagToWealth(t);
    if (wealth) sections.wealth.push(line('tagToWealth', t, wealth));
    let plot = plotToDesc(t);
    if (plot) sections.plot.push(line('plotToDesc', t, plot));
    let want = wantToDesc(t);
    if (want) sections.want.push(line('wantToDesc', t, want));
  });
  return sections;
}

const showDetails = true;
const reducer = (accumulator, currentValue) => accumulator + currentValue;

function rollRole(array) {
  if (array.length < 1) {
    console.log("Role list is empty");
    return;
  }

  const getWeight = R.pluck('weight');
  const totalWeight = getWeight(array).reduce(reducer);

  let r = roll(1, totalWeight);
  let search = 1;
  for (let i = 0; i < array.length; i++) {
    let w = array[i].weight;
    if (r >= search && r < (search + w)) {
      return array[i];
    }
    search += w;
  }

  console.log("rollRole unable to generate");
  console.log(array);
  return "error";
}

function randomArray(array) {
  let r = roll(0, array.length-1);
  return array[r];
}

/* makes the role consistent, so that evil guys don't have good text with 
"ANY" */
function forceRole() {
  let r = roll(1, 3);
  switch (r) {
    case 1:
      return TFACE;
    case 2:
      return THEEL;
    case 3:
      return TSUPPORT;
  }
}

function forceGender() {
  let r = roll(1, 2);
  switch (r) {
    case 1:
      return TMALE;
    case 2:
      return TFEMALE;
  }
}

function randomName(gender) {
  if (gender == TMALE) {
    return randomArray(namesM);
  } else { // including androgynous
    return randomArray(namesF);
  }
}

function roll(min, max) {
  return Math.floor(Math.random() * (max - min + 1) + min);
}

const addTag = R.curry((c, tag) => c.tags.add(tag));
const addExcludes = R.curry((c, tag) => c.excludes.add(tag));
function addTags(c, aspect) {
  aspect.tags.forEach(addTag(c));
  aspect.branchRequirements.forEach(addTag(c));
  aspect.excludes.forEach(addExcludes(c));
  aspect.branchExcludes.forEach(addExcludes(c));
}

/**
 * @fileoverview Roll-lab core. Sits on top of the bundled V7 engine and talks
 * to it only through pure seams (branchesForDetail, generateCharacter,
 * resolveCharacter, characterSections). No DOM. If the engine is rewritten,
 * this file is the contract the new engine must satisfy: buildCharacter(opts)
 * returns a plain data object; everything downstream (Node printer, lab page)
 * renders from that.
 */

"use strict";

// Deterministic RNG. The engine rolls through Math.random (roll(), palette),
// so swapping it for the duration of one build makes the whole pipeline —
// personality, plot, appearance, clothing, concept, palette — reproducible
// from a single integer seed.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function withSeed(seed, fn) {
  const real = Math.random;
  Math.random = mulberry32(seed);
  try { return fn(); } finally { Math.random = real; }
}

// Mirrors loadTags()/loadInitialBranches() without the form. opts:
//   seed:    integer (required — every roll is reproducible)
//   role:    'any' | 'hero' | 'villain' | 'support'
//   gender:  'any' | 'male' | 'female'
//   detail:  'sparse' | 'moderate' | 'high' | 'very-high'
//   noStereotypes: boolean (skips gender tags, they/them pronouns)
//   name:    optional fixed name
function buildCharacter(opts) {
  return withSeed(opts.seed, function () {
    const ROLE_TAGS = { hero: TFACE, villain: THEEL, support: TSUPPORT };

    const tags = [];
    tags.push(ROLE_TAGS[opts.role] || forceRole());

    let gender = '';
    if (!opts.noStereotypes) {
      gender = opts.gender === 'male' ? TMALE
        : opts.gender === 'female' ? TFEMALE
        : forceGender();
      tags.push(gender);
    }
    const name = opts.name || randomName(gender);
    generatePronouns(gender, name);

    const c = new Character(tags, branchesForDetail('detail-' + (opts.detail || 'high')));
    generateCharacter(c);
    resolveCharacter(c);

    return {
      seed: opts.seed,
      opts: opts,
      name: p.Sdesc,
      concept: c.concept,
      stats: c.appearance.values,
      paletteSeed: c.paletteSeed,
      outfit: c.clothing ? c.clothing.outfit : null,
      styleLines: c.clothing ? c.clothing.lines.slice() : [],
      aspects: c.aspects.map(function (a) { return { name: a.name, type: a.type }; }),
      teamType: c.teamType ? c.teamType.name : null,
      tags: Array.from(c.tags).filter(Boolean),
      sections: characterSections(c)
    };
  });
}

// Site display order: Physical, Style, Motivation, Plot Hook, Portrayal,
// Strengths & Weaknesses, Private Details, Wealth.
const LAB_SECTION_ORDER = [
  ['appearance', 'Physical Attributes', 'list'],
  ['want', 'Motivation', 'para'],
  ['plot', 'Plot Hook', 'para'],
  ['portrayal', 'Portrayal', 'list'],
  ['power', 'Strengths & Weaknesses', 'list'],
  ['personal', 'Private Details', 'list'],
  ['wealth', 'Wealth / Equipment', 'list']
];

// Plain-text sheet for terminal reading and diffable fixtures.
// opts.src appends ⟨bank:tag←via⟩ provenance to every line.
function renderCharacterText(data, opts) {
  opts = opts || {};
  const out = [];
  const srcOf = function (l) {
    if (!opts.src) return '';
    const s = l.src || {};
    let mark = s.bank || '?';
    if (s.tag) mark += ':' + s.tag;
    if (s.via) mark += '←' + s.via;
    return '  ⟨' + mark + '⟩';
  };

  out.push('=== ' + data.name.toUpperCase() + ' — ' + (data.concept || '(no concept)') +
    '  [seed ' + data.seed + ' ' + (data.opts.role || 'any') + '/' + (data.opts.detail || 'high') + ']');
  const st = data.stats || {};
  out.push('    eyes ' + (st.eyes || '—') + ' | hair ' + (st.hair || '—') +
    ' | skin ' + (st.skin || '—') + ' | build ' + (st.build || '—') +
    (data.outfit ? ' | outfit ' + data.outfit : ''));
  out.push('    tropes: ' + data.aspects.map(function (a) { return a.name; }).join(', '));

  LAB_SECTION_ORDER.forEach(function (def) {
    const key = def[0], title = def[1], mode = def[2];
    const lines = (data.sections[key] || []);
    if (!lines.length) return;
    out.push('  ' + title.toUpperCase());
    if (mode === 'para') {
      lines.forEach(function (l) { out.push('    ' + l.text + srcOf(l)); });
    } else {
      lines.forEach(function (l) { out.push('    • ' + l.text + srcOf(l)); });
    }
  });
  if (data.styleLines.length && opts.style) {
    out.push('  STYLE');
    data.styleLines.forEach(function (t) { out.push('    • ' + t); });
  }
  return out.join('\n');
}


/* ---------- lab page ---------- */
(function () {
  "use strict";

  initAspects(); initTeams(); initPlots(); initWants();

  const LS_KEY = 'rcg-lab-flags-v1';
  let current = null;
  let flags = [];
  try { flags = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { flags = []; }

  const $id = (x) => document.getElementById(x);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function newSeed() {
    return (Date.now() % 2147483647) ^ Math.floor(Math.random() * 0xffff);
  }

  function srcMark(l) {
    const s = l.src || {};
    let m = s.bank || '';
    if (s.tag) m += ':' + s.tag;
    if (s.via) m += ' \u2190 ' + s.via;
    return m;
  }

  function renderSheet(data) {
    const st = data.stats || {};
    let html = '<div class="portrait">';
    if (typeof generatePalette === 'function' && typeof palettePieSvg === 'function') {
      html += '<div class="pie">' + palettePieSvg(generatePalette(data.paletteSeed || undefined), 84) + '</div>';
    }
    html += '<div><h1 class="char-name">' + esc(data.name) + '</h1>';
    if (data.concept) html += '<p class="concept">' + esc(data.concept) + '</p>';
    html += '<div class="stats">' +
      '<span><span class="k">Eyes</span>' + esc(st.eyes || '\u2014') + '</span>' +
      '<span><span class="k">Hair</span>' + esc(st.hair || '\u2014') + '</span>' +
      '<span><span class="k">Skin</span>' + esc(st.skin || '\u2014') + '</span>' +
      '<span><span class="k">Build</span>' + esc(st.build || '\u2014') + '</span>' +
      '</div></div></div>';

    LAB_SECTION_ORDER.forEach(function (def) {
      const key = def[0], title = def[1], mode = def[2];
      const lines = data.sections[key] || [];
      if (!lines.length) return;
      html += '<div class="section"><h2>' + esc(title) + '</h2>';
      if (mode === 'para') {
        html += lines.map(l => '<p>' + esc(l.text) +
          '<span class="src">' + esc(srcMark(l)) + '</span></p>').join('');
      } else {
        html += '<ul>' + lines.map(l => '<li>' + esc(l.text) +
          '<span class="src">' + esc(srcMark(l)) + '</span></li>').join('') + '</ul>';
      }
      html += '</div>';
    });

    if (data.outfit) {
      html += '<p class="style-line">Style \u2014 ' + esc(data.outfit);
      if (data.styleLines.length) html += '. ' + data.styleLines.map(esc).join(' ');
      html += '</p>';
    }

    html += '<div class="seed-line"><span>seed ' + data.seed + ' \u00b7 ' +
      esc(data.opts.role) + '/' + esc(data.opts.detail) + '</span>' +
      '<button id="srcToggle" type="button">sources</button></div>';

    $id('sheet').innerHTML = html;
    $id('srcToggle').addEventListener('click', function () {
      $id('sheet').classList.toggle('show-src');
    });
  }

  function isFlagged(seed) {
    return flags.some(f => f.data.seed === seed);
  }

  function refreshBar() {
    $id('flagCount').textContent = flags.length;
    const b = $id('flagBtn');
    const on = current && isFlagged(current.seed);
    b.classList.toggle('flagged', !!on);
    b.innerHTML = on ? '\u2691 Flagged' : '\u2690 Flag';
  }

  function saveFlags() {
    localStorage.setItem(LS_KEY, JSON.stringify(flags));
    refreshBar();
    renderDrawer();
  }

  function roll() {
    const opts = {
      seed: newSeed(),
      role: $id('role').value,
      gender: 'any',
      detail: $id('detail').value
    };
    current = buildCharacter(opts);
    renderSheet(current);
    refreshBar();
  }

  function toggleFlag() {
    if (!current) return;
    const i = flags.findIndex(f => f.data.seed === current.seed);
    if (i >= 0) { flags.splice(i, 1); toast('Flag removed'); }
    else {
      flags.push({ at: new Date().toISOString(), note: '', data: current });
      toast('Flagged \u2014 note it in the drawer if you like');
    }
    saveFlags();
  }

  function renderDrawer() {
    const d = $id('drawer');
    if (!flags.length) {
      d.innerHTML = '<h2>Flags</h2><p style="font-size:0.85rem;color:var(--muted)">Nothing flagged yet. Roll until something looks weird, then hit Flag.</p>';
      return;
    }
    let html = '<h2>Flags (' + flags.length + ')</h2><ul>';
    flags.forEach(function (f, i) {
      html += '<li><div style="flex:1"><strong>' + esc(f.data.name) + '</strong>' +
        ' <span style="color:var(--muted)">\u2014 ' + esc(f.data.concept || '') +
        ' \u00b7 seed ' + f.data.seed + '</span>' +
        '<input class="note-input" data-i="' + i + '" placeholder="what looked off?" value="' + esc(f.note) + '">' +
        '</div><button class="rm" data-rm="' + i + '">remove</button></li>';
    });
    html += '</ul><div class="drawer-actions">' +
      '<button id="copyBtn">Copy JSON</button>' +
      '<button id="clearBtn">Clear all</button></div>';
    d.innerHTML = html;

    d.querySelectorAll('.note-input').forEach(function (inp) {
      inp.addEventListener('change', function () {
        flags[+inp.dataset.i].note = inp.value;
        localStorage.setItem(LS_KEY, JSON.stringify(flags));
      });
    });
    d.querySelectorAll('.rm').forEach(function (btn) {
      btn.addEventListener('click', function () {
        flags.splice(+btn.dataset.rm, 1);
        saveFlags();
      });
    });
    d.querySelector('#copyBtn').addEventListener('click', function () {
      navigator.clipboard.writeText(JSON.stringify(flags, null, 2)).then(
        () => toast('Copied ' + flags.length + ' flag' + (flags.length === 1 ? '' : 's')),
        () => toast('Copy failed \u2014 select manually'));
    });
    d.querySelector('#clearBtn').addEventListener('click', function () {
      if (confirm('Clear all ' + flags.length + ' flags?')) { flags = []; saveFlags(); }
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $id('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  $id('rollBtn').addEventListener('click', roll);
  $id('flagBtn').addEventListener('click', toggleFlag);
  $id('drawerBtn').addEventListener('click', function () {
    $id('drawer').classList.toggle('open');
    renderDrawer();
  });

  renderDrawer();
  roll();
})();

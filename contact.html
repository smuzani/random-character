<div class="container">

  <h1 class="text-center">Contact Us</h1>
  <br>
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-xl-6">
      <p class="text-justify">Send in anything - feature requests, complaints, feedback. We can't promise we'll reply to all of it, but we'll read it.</p>
    </div>
  </div>
  <br>
  <!-- Contact Form -->
  <form id="contact-form" netlify>
    <div class="form-group row justify-content-center">
      <label for="form-name" class="col-4 col-md-3 col-xl-2">Name</label>
      <div class="col-8 col-md-5 col-xl-4">
        <input type="text" name="form-name" id="form-name" class="form-control" required>
      </div>
    </div>
    <div class="form-group row justify-content-center">
      <label for="form-email" class="col-4 col-md-3 col-xl-2">E-mail</label>
      <div class="col-8 col-md-5 col-xl-4">
        <input type="email" name="form-email" id="form-email" class="form-control">
      </div>
    </div>
    <div class="form-group row justify-content-center">
      <label for="form-type" class="col-4 col-md-3 col-xl-2">Type</label>
      <div class="col-8 col-md-5 col-xl-4">
        <select class="form-control" id="form-type">
          <option selected value="type-default" id="type-default">Other</option>
          <option value="type-complaint" id="type-complaint">Complaint</option>
          <option value="type-suggestion" id="type-suggestion">Suggestion</option>
          <option value="type-feedback" id="type-feedback">Feedback</option>
        </select>
      </div>
    </div>
    <div class="form-group row justify-content-center">
      <label for="form-message" class="col-4 col-md-3 col-xl-2">Message</label>
      <div class="col-8 col-md-5 col-xl-4">
        <textarea name="form-message" id="form-message" class="form-control" required rows="4"></textarea>
      </div>
    </div>
    <button id="submit-feedback" type="submit" class="mx-auto d-block btn btn-primary">Submit</button>
  </form>
  <br>

[build]
  command = "node dialogue/build-site.mjs"
  publish = "dialogue/dist"
  functions = "dialogue/netlify/functions"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/dialogue/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # Paddle.js injects inline styles for its checkout overlay and loading indicator.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.paddle.com https://sandbox-cdn.paddle.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://cdn.paddle.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.paddle.com; frame-src https://*.paddle.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/api/payments"
  to = "/.netlify/functions/payments"
  status = 200

[[redirects]]
  from = "/api/dialogue"
  to = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/ai-policy.html"
  to = "/terms.html#ai-usage"
  status = 301
  force = true

[[redirects]]
  from = "/refunds.html"
  to = "/pricing.html#refund-policy"
  status = 301
  force = true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Dialogue Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../css/generator-layout.css">
  <script src="../js/generator-layout.js" defer></script>
  <script src="../js/tag-details.js" defer></script>
  <script src="../js/plot-details.js" defer></script>
  <script src="../js/want-details.js" defer></script>
  <script src="../js/generator7.js" defer></script>
  <script src="../js/character-library.js" defer></script>
  <script src="character-rolls.js" defer></script>
  <script src="app.js" defer></script>
  <script src="public-config.js" defer></script>
  <script src="vendor/supabase-2.119.0.js" defer></script>
  <script src="account.js" defer></script>
  <link rel="stylesheet" href="../css/account.css">
</head>
<body>
  <header class="top-header">
    <div class="header-container">
      <a class="site-brand" href="../" aria-label="Random Character Generator">RCG</a>
      <nav class="main-nav">
        <a href="../">Create</a>
        <a href="./" aria-current="page">Dialogue</a>
        <a href="../whatisthis.html">About</a>
        <a href="../roadmap.html">Roadmap</a>
      </nav>
      <button id="open-account" class="header-account" type="button" aria-haspopup="dialog" aria-controls="account-dialog" hidden>
        <span id="account-label">Account</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="app-layout generator-layout">
    <div class="generator-toolbar">
      <button type="button" class="generator-toggle" data-controls-toggle aria-controls="generator-controls" aria-expanded="true" aria-label="Dialogue settings" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1>Dialogue Generator</h1>
        <p class="generator-subtitle">Set the scene, pick your cast, and generate a screenplay.</p>
      </div>
    </div>
    <section class="generator-controls" id="generator-controls" aria-label="Scene controls">
      <div class="scene-actions">
        <button id="open-setup" type="button" aria-haspopup="dialog">Scene setup</button>
        <button id="open-cast" type="button" aria-haspopup="dialog">Characters <span id="cast-count"></span></button>
        <button id="generate" class="primary" type="button">Generate dialogue</button>
      </div>
      <div id="account-controls" hidden>
        <label for="model">Model</label>
        <select id="model" aria-describedby="scene-price"></select>
        <span id="scene-price" role="status"></span>
      </div>
    </section>
    <section class="preview generator-result" aria-label="Screenplay preview">
      <p id="status" role="status"></p>
      <div class="preview-toolbar">
        <span id="draft-label">Sample scene</span>
        <div>
          <button id="copy" type="button">Copy</button>
          <button id="download" type="button">Download .txt</button>
        </div>
      </div>
      <article id="screenplay"></article>
    </section>
  </main>

  <dialog id="setup-dialog" aria-labelledby="setup-title">
    <form id="scene-form">
      <div class="section-heading">
        <h2 id="setup-title">Scene setup</h2>
        <button type="button" class="close-dialog" data-close aria-label="Close scene setup">×</button>
      </div>
      <label for="location">Where they meet</label>
      <input id="location" maxlength="160" required>
      <label for="start">Starting point</label>
      <textarea id="start" rows="3" maxlength="700" required></textarea>
      <label for="end">Where it ends</label>
      <textarea id="end" rows="3" maxlength="700" required></textarea>
      <div class="options">
        <div>
          <label for="tone">Tone</label>
          <select id="tone">
            <option>Sitcom</option>
            <option>Standoff</option>
            <option>Drama</option>
            <option>Flirty Banter</option>
            <option>Awkward Reunion</option>
            <option>Interrogation</option>
          </select>
        </div>
        <div>
          <label for="length">Length</label>
          <select id="length"><option value="short">Short</option><option id="medium-length" value="medium" selected>Medium</option></select>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="randomize">Randomize</button>
        <button type="submit" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="cast-dialog" aria-labelledby="cast-title">
    <div class="section-heading">
      <h2 id="cast-title">Characters</h2>
      <button type="button" class="close-dialog" data-close aria-label="Close characters">×</button>
    </div>
    <div id="characters"></div>
    <p id="cast-status" class="dialog-status" role="status"></p>
    <div class="dialog-actions">
      <button type="button" id="add-character">Add character</button>
      <button type="button" class="primary" data-close>Done</button>
    </div>
  </dialog>

  <dialog id="character-dialog" aria-labelledby="character-title">
    <form id="character-form">
      <div class="section-heading">
        <h2 id="character-title">Edit character</h2>
        <button type="button" class="close-dialog" data-close aria-label="Close character editor">×</button>
      </div>
      <label for="character-name">Name</label>
      <input id="character-name" maxlength="60" required>
      <label for="character-voice">Voice / temperament</label>
      <textarea id="character-voice" maxlength="200" required></textarea>
      <div class="field-heading">
        <label for="character-want">What they want</label>
        <button type="button" data-roll="want">Roll want</button>
      </div>
      <textarea id="character-want" rows="3" maxlength="400" required></textarea>
      <div class="field-heading">
        <label for="character-obstacle">What gets in their way</label>
        <button type="button" data-roll="obstacle">Roll obstacle</button>
      </div>
      <textarea id="character-obstacle" rows="3" maxlength="400" required></textarea>
      <p id="character-status" class="dialog-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" data-close>Cancel</button>
        <button type="submit" class="primary">Save character</button>
      </div>
    </form>
  </dialog>
  <dialog id="account-dialog" aria-labelledby="account-title">
    <div class="account-dialog-heading">
      <h2 id="account-title">Account</h2>
      <button type="button" id="close-account" aria-label="Close account">×</button>
    </div>
    <form id="sign-in-form" hidden>
      <label for="account-email">Email</label>
      <input id="account-email" type="email" autocomplete="email" required>
      <button id="send-link" type="submit">Send sign-in link</button>
    </form>
    <p id="account-balance" role="status"></p>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <p id="account-status" role="status"></p>
  </dialog>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Dialogue Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<header class="top-header">
  <div class="header-container"><span class="site-brand">RCG</span><span class="prototype">Prototype</span></div>
</header>
<main class="app-layout">
<section class="editor" aria-labelledby="page-title">
<h1 id="page-title">Dialogue Generator</h1>
<form id="scene-form" class="controls-panel">
<section class="setup"><div class="section-heading"><h2>Scene setup</h2><button type="button" id="randomize" class="text-button">Randomize</button></div>
<label for="location">Where they meet</label><input id="location" maxlength="160" required>
<label for="start">Starting point</label><textarea id="start" rows="3" maxlength="700" required></textarea>
<label for="end">Where it ends</label><textarea id="end" rows="3" maxlength="700" required></textarea>
<div class="options"><div><label for="tone">Tone</label><select id="tone"><option>Thriller</option><option>Comedy</option><option>Drama</option><option>Romance</option><option>Fantasy</option><option>Science fiction</option></select></div><div><label for="length">Length</label><select id="length"><option value="short">Short</option><option value="medium" selected>Medium</option></select></div></div>
</section>
<section class="cast"><div class="section-heading"><h2>Scene characters</h2><span id="cast-count"></span></div><div id="characters"></div><button type="button" id="add-character" class="add">+ Add character</button></section>
<div class="generate-panel"><button id="generate" class="primary" type="submit">Generate dialogue</button><p id="status" role="status" aria-live="polite"></p></div>
</form>
</section>
<section class="preview" aria-label="Screenplay preview"><div class="preview-toolbar"><span id="draft-label">Sample scene</span><div><button id="copy" type="button">Copy</button><button id="download" type="button">Download .txt</button></div></div><article class="paper"><div class="paper-meta"><span>Dialogue / screenplay</span><span id="version">Sample</span></div><div id="screenplay"></div></article></section>
</main>
<dialog id="character-dialog"><form id="character-form"><div class="section-heading"><h2>Edit character</h2><button type="button" id="close-dialog" aria-label="Close">×</button></div><label for="character-name">Name</label><input id="character-name" maxlength="60" required><label for="character-voice">Voice / temperament</label><input id="character-voice" maxlength="200" required><label for="character-want">What they want</label><textarea id="character-want" maxlength="400" required></textarea><label for="character-obstacle">What gets in their way</label><textarea id="character-obstacle" maxlength="400" required></textarea><div class="dialog-actions"><button type="button" id="remove-character">Remove</button><button type="submit" class="primary">Save character</button></div></form></dialog>
</body></html>
